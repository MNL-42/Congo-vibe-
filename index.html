const canPush=()=>"serviceWorker"in navigator&&"PushManager"in window&&"Notification"in window;
async function enableNotifs(quiet){if(!canPush())return quiet||toast("Notifications non prises en charge ici");
  if(Notification.permission!=="granted"){const p=await Notification.requestPermission();if(p!=="granted")return toast("Notifications bloquées : autorise-les dans les réglages du site")}
  try{const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});
    const j=sub.toJSON();const{error}=await sb.from("push_subs").upsert({user_id:me.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:"endpoint"});if(error)throw error;
    quiet===true||toast("Notifications activées");$("#nb")?.remove()}catch(e){quiet===true||toast("Activation impossible")}}

async function doAuth(mode){
  const email=$("#em").value.trim(),password=$("#pw").value;if(!email||!password)return toast("Remplis e-mail et mot de passe");
  $("#ab").disabled=true;
  const r=mode==="in"?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password,options:{data:{display_name:$("#dn").value.trim()}}});
  if(r.error){$("#ab").disabled=false;return toast(({"Invalid login credentials":"E-mail ou mot de passe incorrect","User already registered":"Cet e-mail a déjà un compte"})[r.error.message]||r.error.message)}
  if(mode==="up"&&!r.data.session){const l=await sb.auth.signInWithPassword({email,password});if(l.error){$("#ab").disabled=false;return toast(l.error.message)}}
  boot();
}
async function loadMe(){const{data:{user}}=await sb.auth.getUser();if(!user)return null;const{data}=await sb.from("profiles").select("*").eq("id",user.id).single();return data}
async function boot(){
  me=await loadMe();if(!me)return authScreen();
  app.innerHTML=`<div class="orbs"><i></i><i></i><i></i></div><header><div class="brand">${LOGO}<div class="word">Congo <span>Vibe</span></div></div><div class="chip glass" id="who" onclick="go('me')"></div></header><main id="mn"></main>
  <nav class="glass">${[["home","Accueil"],["video","Vidéos"],["new","Créer"],["news","Actus"],["chat","Messages"]].map(([k,l])=>`<button data-v="${k}" class="${k==="new"?"mid":""}" aria-label="${l}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${NI[k]}</svg>${k==="new"?"":l}</button>`).join("")}</nav>`;
  $("#who").textContent="@"+me.username;
  sb.channel("msgs").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>{const m=p.new;if(m.receiver!==me.id&&m.sender!==me.id)return;
    if(view==="chat"&&chatWith&&(m.sender===chatWith||m.receiver===chatWith)){appendMsg(m);if(m.receiver===me.id)sb.rpc("mark_read",{other:chatWith})}
    else if(view==="chat"&&!chatWith)renderChats();else if(m.receiver===me.id)toast("Nouveau message")})
  .on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages"},p=>{const m=p.new;if(m.read_at&&m.sender===me.id)document.querySelectorAll(`[data-m="${m.id}"]`).forEach(e=>e.classList.add("rd"))}).subscribe();
  chT=sb.channel("typing").on("broadcast",{event:"t"},p=>{if(p.payload.to===me.id&&p.payload.from===chatWith)showTyping()}).subscribe();
  presenceChannel=sb.channel("online-users",{config:{presence:{key:me.id}}});
  presenceChannel.on("presence",{event:"sync"},()=>{const state=presenceChannel.presenceState();onlineUsers=new Set(Object.values(state).flat().map(x=>x.user_id).filter(Boolean));paintChatPresence()}).subscribe(async status=>{if(status==="SUBSCRIBED")await presenceChannel.track({user_id:me.id,username:me.username,online_at:new Date().toISOString()})});
  if(canPush()&&Notification.permission==="granted")enableNotifs(true);
  openFromHash()||go("home");
}

async function loadNews(force){
  if(NEWS&&!force&&!NEWS.error)return NEWS;
  try{const r=await fetch(SB_URL+"/functions/v1/news",{headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}});if(!r.ok)throw 0;NEWS=await r.json()}catch(e){NEWS={items:[],sources:[],error:true}}
  return NEWS;
}
const nImg=n=>n.image?`<img alt="" loading="lazy" referrerpolicy="no-referrer" src="${esc(n.image)}" onerror="this.remove()">`:"";
const newsCard=(n,cls="")=>`<a class="nc ${cls}" href="${safeUrl(n.link)}" target="_blank" rel="noopener noreferrer"><div class="im"><span class="ini">${esc(n.source[0])}</span>${nImg(n)}</div><div class="sh"></div><div class="tx"><span class="src">${esc(n.source)}</span><div class="tt">${esc(n.title)}</div><div class="tm">${n.date?ago(n.date):""}${n.summary?" · "+esc(n.summary.slice(0,70))+"…":""}</div></div></a>`;
function paintNews(){
  const box=$("#nw");if(!box)return;const d=NEWS;
  if(!d||d.error||!d.items.length){box.innerHTML=`<div class="err">Les actualités ne se chargent pas pour le moment.<br><button class="btn sm" style="margin-top:8px" onclick="loadNews(true).then(paintNews)">Réessayer</button></div>`;return}
  const items=newsSrc==="Tous"?d.items:d.items.filter(i=>i.source===newsSrc);
  box.innerHTML=`<div class="tabs">${["Tous",...d.sources].map(s=>`<button class="${s===newsSrc?"on":""}" onclick="newsSrc=this.textContent;paintNews()">${esc(s)}</button>`).join("")}</div><div class="list">${items.slice(0,40).map((n,i)=>newsCard(n,i===0?"hero":"")).join("")}</div>`;
}

const PROF="profiles!user_id(id,username,display_name,avatar_url,verified,role,premium_until)";
function cleanMain(){const m=$("#mn");m.className="";$("#app").classList.remove("inchat");return m}
async function renderFeed(kind){
  const mn=cleanMain();mn.innerHTML='<div class="skel" style="height:300px"></div><div class="skel"></div>';
  let q=sb.from("posts").select("*,"+PROF+",likes(user_id),comments(count)").order("boosted",{ascending:false}).order("created_at",{ascending:false}).limit(60);
  if(kind==="news")q=q.eq("kind","news");
  else if(tab==="following"){const{data:f}=await sb.from("follows").select("following").eq("follower",me.id);q=q.in("user_id",(f||[]).map(x=>x.following).concat(me.id)).neq("kind","story")}
  else q=q.neq("kind","story");
  const[{data:posts,error},st]=await Promise.all([q,kind==="all"?sb.from("posts").select("id,content,media_url,media_type,meta,"+PROF).eq("kind","story").order("created_at",{ascending:false}):{data:[]}]);
  if(view!==(kind==="news"?"news":"home"))return;
  if(error)return mn.innerHTML=`<div class="err">Impossible de charger le fil. Vérifie ta connexion.<br><button class="btn sm" style="margin-top:8px" onclick="renderFeed('${kind}')">Réessayer</button></div>`;
  window._stories=st.data||[];
  const empty=`<div class="empty"><b style="color:var(--fg)">${kind==="news"?"Pas encore de publication de médias":"Rien ici pour le moment"}</b><br>${kind==="news"?"Les médias vérifiés publieront ici.":"Sois le premier à publier !"}</div>`;
  if(kind==="news"){
    mn.innerHTML=`<div class="h">À la une en RDC</div><div id="nw"><div class="skel" style="height:340px"></div></div><div class="h" style="margin-top:20px">Médias vérifiés sur Congo Vibe</div>${(posts||[]).map(postHTML).join("")||empty}`;
    loadNews().then(paintNews);initVideos(mn);return;
  }
  mn.innerHTML=`${notifBanner()}<div class="tabs"><button class="${tab==="all"?"on":""}" onclick="tab='all';renderFeed('all')">Pour toi</button><button class="${tab==="following"?"on":""}" onclick="tab='following';renderFeed('all')">Abonnements</button></div>
  <div id="strip"></div>${window._stories.length?`<div class="stories">${window._stories.map(s=>`<div class="st" onclick="viewStory(${s.id})">${av(s.profiles)}<div style="margin-top:6px">${esc(s.profiles.username)}</div></div>`).join("")}</div>`:""}
  ${(posts||[]).map(postHTML).join("")||empty}`;

}
function vidEl(url,m,cls=""){m=m||{};return `<div class="vw ${cls}"><video src="${esc(url)}" preload="metadata" playsinline loop muted data-s="${+m.s||0}" data-e="${+m.e||0}" data-sp="${+m.sp||1}" style="filter:${FILT[m.f]||"none"}"></video>${m.t?`<div class="ov">${esc(m.t)}</div>`:""}<div class="pp">${ic(I.play)}</div></div>`}
const IO=new IntersectionObserver(es=>es.forEach(en=>{const v=en.target;if(en.isIntersecting&&en.intersectionRatio>.6)playV(v);else v.pause()}),{threshold:[0,.6]});
function playV(v){v.muted=v.closest(".reel")?vmuted:true;v.play().catch(()=>{v.muted=true;v.play().catch(()=>{})})}
function initVideos(root){root.querySelectorAll("iframe[data-src]").forEach(f=>{if(!f._i){f._i=1;IE.observe(f)}});root.querySelectorAll("video[data-sp]").forEach(v=>{if(v._i)return;v._i=1;const s=+v.dataset.s,e=+v.dataset.e,sp=+v.dataset.sp,w=v.parentElement;
  v.addEventListener("loadedmetadata",()=>{v.playbackRate=sp;if(s)v.currentTime=s});
  v.addEventListener("timeupdate",()=>{if(e&&v.currentTime>=e)v.currentTime=s});
  v.addEventListener("play",()=>{v.playbackRate=sp;w.classList.add("playing")});v.addEventListener("pause",()=>w.classList.remove("playing"));
  w.addEventListener("click",()=>v.paused?playV(v):v.pause());IO.observe(v)})}
const okId=i=>/^\d{10,22}$/.test(String(i));
function embedEl(m,reel){if(!okId(m?.id))return"";const u=`https://www.tiktok.com/player/v1/${m.id}?loop=1&rel=0&music_info=1&description=1`;
  return `<div class="vw emb ${reel?"full":""}"><iframe ${reel?`data-src="${u}"`:`src="${u}" loading="lazy"`} allow="autoplay; fullscreen; encrypted-media" allowfullscreen title="Vidéo TikTok"></iframe>${reel?'<div class="tap" onclick="tapEmb(this)"></div>':""}</div>`}
function tapEmb(el){el.style.display="none";setTimeout(()=>el.style.display="",6000)}
const IE=new IntersectionObserver(es=>es.forEach(en=>{const f=en.target;if(en.isIntersecting&&en.intersectionRatio>.6){if(!f.src||f.src==="about:blank")f.src=f.dataset.src}else if(f.src&&f.src!=="about:blank")f.src="about:blank"}),{threshold:[0,.6]});
async function ttInfo(url){let r;try{r=await fetch(SB_URL+"/functions/v1/tt?url="+encodeURIComponent(url),{headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}})}catch(e){throw new Error("Réseau indisponible")}
  const j=await r.json();if(!r.ok||!j.id)throw new Error(j.error||"Lien TikTok invalide");return j}
function mediaHTML(p){if(p.media_type==="embed")return embedEl(p.meta)+`<div class="mu" style="margin-top:6px">Vidéo TikTok${p.meta?.author?" · @"+esc(p.meta.author):""}</div>`;return p.media_url?(p.media_type==="video"?vidEl(p.media_url,p.meta):`<img class="m" alt="" loading="lazy" src="${esc(p.media_url)}">`):""}
function postHTML(p){
  const liked=p.likes.some(l=>l.user_id===me.id),n=p.comments[0]?.count||0;
  return `<div class="card glass post" id="p${p.id}"><div class="row">${av(p.profiles)}<div style="flex:1;min-width:0"><div class="nm">${esc(p.profiles.display_name)}${badges(p.profiles)}</div><div class="mu">@${esc(p.profiles.username)} · ${ago(p.created_at)}${p.kind==="news"?" · Actu":""}${p.boosted?" · Sponsorisé":""}</div></div>

  ${p.content?`<div style="margin-top:10px;white-space:pre-wrap">${esc(p.content)}</div>`:""}${mediaHTML(p)}
  <div class="act"><button class="${liked?"on":""}" onclick="likeP(${p.id},this)">${ic(I.heart)}<span>${p.likes.length}</span></button><button onclick="comments(${p.id})">${ic(I.cmt)}${n}</button><button onclick="share()">${ic(I.share)}Partager</button></div></div>`;
}
async function likeP(id,btn){const was=btn.classList.contains("on"),s=btn.querySelector("span"),n=+s.textContent;
  btn.classList.toggle("on",!was);s.textContent=n+(was?-1:1);
  const{error}=await(was?sb.from("likes").delete().match({post_id:id,user_id:me.id}):sb.from("likes").insert({post_id:id,user_id:me.id}));
  if(error){btn.classList.toggle("on",was);s.textContent=n}}

async function addComment(id){const i=$("#ci"),v=i.value.trim();if(!v)return;i.value="";const{error}=await sb.from("comments").insert({post_id:id,user_id:me.id,content:v});if(error)return toast(error.message);loadCm(id)}

/* ---------- VIDÉOS (style TikTok) ---------- */
async function renderVideos(){
  const mn=$("#mn");mn.className="noPad";$("#app").classList.remove("inchat");mn.innerHTML='<div class="skel" style="margin:80px 16px;height:300px"></div>';
  const{data,error}=await sb.from("posts").select("*,"+PROF+",likes(user_id),comments(count)").in("media_type",["video","embed"]).neq("kind","story").order("created_at",{ascending:false}).limit(30);
  if(view!=="video")return;
  if(error)return mn.innerHTML=`<div class="err" style="margin:80px 16px">Impossible de charger les vidéos.<br><button class="btn sm" style="margin-top:8px" onclick="renderVideos()">Réessayer</button></div>`;
  if(!data.length)return mn.innerHTML=`<div class="empty" style="padding-top:120px"><b style="color:var(--fg);font-size:18px">Pas encore de vidéo</b><br>Publie la première vidéo de Congo Vibe.<br><button class="btn" style="margin-top:14px" onclick="go('new')">Créer une vidéo</button></div>`;
  const H=mn.clientHeight;
  mn.innerHTML=data.map(p=>{const liked=p.likes.some(l=>l.user_id===me.id);return `<section class="reel ${p.media_type==="embed"?"e":""}" id="p${p.id}" style="height:${H}px">${p.media_type==="embed"?embedEl(p.meta,1):vidEl(p.media_url,p.meta,"full")}<div class="rsh"></div>
  <div class="rinfo"><div class="row" style="margin-bottom:8px">${av(p.profiles)}<div><div class="nm">${esc(p.profiles.display_name)}${badges(p.profiles)}</div><div class="mu" style="color:#d5dcf0">@${esc(p.profiles.username)}</div></div></div><div style="white-space:pre-wrap">${esc(p.content)}</div></div>
  <div class="rside"><button class="rb ${liked?"on":""}" onclick="likeP(${p.id},this)">${ic(I.heart)}<span>${p.likes.length}</span></button><button class="rb" onclick="comments(${p.id})">${ic(I.cmt)}<span>${p.comments[0]?.count||0}</span></button><button class="rb" onclick="share()">${ic(I.share)}<span>Partager</span></button><button class="rb" onclick="vmuted=!vmuted;document.querySelectorAll('.reel video').forEach(v=>v.muted=vmuted);toast(vmuted?'Son coupé':'Son activé')">${ic(I.snd)}<span>Son</span></button></div></section>`}).join("");
  initVideos(mn);
}

/* ---------- CRÉER ---------- */
let FILE=null,ED={};
function renderNew(){
  const mn=cleanMain(),canNews=me.verified||me.role==="admin",prem=isPrem(me);FILE=null;
  mn.innerHTML=`<div class="h">Créer</div><div class="card glass"><textarea id="tx" maxlength="2000" placeholder="Quoi de neuf à Kinshasa ?"></textarea>
  <div class="row wrap" style="margin:6px 0"><label class="btn g sm up">${ic(I.clip)} Photo / vidéo<input id="fl" type="file" accept="image/*,video/*" hidden onchange="pickFile(this)"></label><label class="btn g sm up">${ic(I.vid)} Filmer<input id="fc" type="file" accept="video/*" capture="environment" hidden onchange="pickFile(this)"></label></div>
  <div id="prev"></div><input id="tl" placeholder="Ou colle un lien de vidéo TikTok" inputmode="url" autocomplete="off">
  <select id="kd"><option value="post">Publication</option>${canNews?'<option value="news">Actualité (fil congolais)</option>':""}<option value="story">Story 48 h${prem?"":" (Premium)"}</option></select>
  <label class="row mu" style="margin:8px 0"><input id="bo" type="checkbox"> Booster en haut du fil${prem?"":" (Premium)"}</label>
  <button class="btn full" id="pb" onclick="publish()">Publier</button></div>
  ${prem?"":'<div class="card glass mu">Passe en Premium pour les stories, le boost et le badge. <a href="#" onclick="premiumPage();return false">Voir les offres</a></div>'}`;
}
function pickFile(inp){const f=inp.files[0];if(!f)return;if(f.size>52428800){inp.value="";return toast("Fichier trop lourd (50 Mo maximum)")}
  FILE=f;const url=URL.createObjectURL(f),vid=f.type.startsWith("video/");
  if(!vid){$("#prev").innerHTML=`<img alt="" src="${url}" style="width:100%;border-radius:16px;margin:8px 0;max-height:360px;object-fit:cover">`;return}
  ED={f:"none",sp:1,s:0,e:0,t:"",d:0};
  $("#prev").innerHTML=`<div class="ed"><div class="vw"><video id="pv" src="${url}" playsinline muted loop autoplay></video><div class="ov" id="pov"></div></div>
  <div class="lb">Filtre</div><div class="tabs" id="ff">${Object.keys(FILT).map(k=>`<button class="${k==="none"?"on":""}" onclick="setF('${k}',this)">${FN[k]}</button>`).join("")}</div>
  <div class="lb">Vitesse</div><div class="tabs" id="fs">${[.5,1,1.5,2].map(x=>`<button class="${x===1?"on":""}" onclick="setSp(${x},this)">${x}x</button>`).join("")}</div>
  <div class="lb">Couper : <b id="tl">0:00</b></div><div class="mu">Début</div><input id="t0" type="range" min="0" max="1" step="0.1" value="0" oninput="trim()"><div class="mu">Fin</div><input id="t1" type="range" min="0" max="1" step="0.1" value="1" oninput="trim()">
  <div class="lb">Texte sur la vidéo</div><input id="vt" maxlength="60" placeholder="Ex : Kinshasa by night" oninput="ED.t=this.value;$('#pov').textContent=this.value"></div>`;
  const v=$("#pv");v.onloadedmetadata=()=>{ED.d=ED.e=v.duration;$("#t0").max=$("#t1").max=v.duration;$("#t1").value=v.duration;$("#tl").textContent="0:00 - "+fmt(v.duration)};
  v.ontimeupdate=()=>{if(ED.e&&v.currentTime>=ED.e)v.currentTime=ED.s};
}
function setF(k,b){ED.f=k;$("#pv").style.filter=FILT[k]||"none";b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))}
function setSp(x,b){ED.sp=x;$("#pv").playbackRate=x;b.parentNode.querySelectorAll("button").forEach(y=>y.classList.toggle("on",y===b))}
function trim(){let s=+$("#t0").value,e=+$("#t1").value;if(e-s<1){if(document.activeElement.id==="t0")s=Math.max(0,e-1);else e=Math.min(ED.d,s+1);$("#t0").value=s;$("#t1").value=e}ED.s=s;ED.e=e;$("#tl").textContent=fmt(s)+" - "+fmt(e);const v=$("#pv");if(v.currentTime<s||v.currentTime>e)v.currentTime=s}
async function publish(){
  const content=$("#tx").value.trim();if(!content&&!FILE&&!($("#tl")?.value.trim()))return toast("Écris quelque chose ou ajoute un média");
  $("#pb").disabled=true;$("#pb").textContent="Envoi en cours…";let media_url=null,media_type="image",meta={};
  const tl=($("#tl")?.value||"").trim();if(tl){try{const e=await ttInfo(tl);media_url=tl;media_type="embed";meta={id:e.id,author:e.author}}catch(er){$("#pb").disabled=false;$("#pb").textContent="Publier";return toast(er.message)}}
  if(FILE){const path=`${me.id}/${Date.now()}-${FILE.name.replace(/[^\w.]/g,"_")}`;const u=await sb.storage.from("media").upload(path,FILE,{contentType:FILE.type||undefined});if(u.error){$("#pb").disabled=false;$("#pb").textContent="Publier";return toast(u.error.message)}
    media_url=sb.storage.from("media").getPublicUrl(path).data.publicUrl;
    if(FILE.type.startsWith("video/")){media_type="video";meta={f:ED.f,sp:ED.sp,s:ED.s,t:ED.t,e:ED.e&&ED.e<ED.d-.2?ED.e:0}}}
  const{error}=await sb.from("posts").insert({user_id:me.id,content,media_url,media_type,meta,kind:$("#kd").value,boosted:$("#bo").checked});
  $("#pb").disabled=false;$("#pb").textContent="Publier";if(error)return toast(error.message.includes("Premium")?"Fonction réservée aux membres Premium":error.message);
  toast("Publié !");go($("#kd").value==="news"?"news":["video","embed"].includes(media_type)?"video":"home");
}

/* ---------- MESSAGES (style WhatsApp) ---------- */
let rec=null,typT=0,typShow=0,chT=null;
async function renderChats(){
  chatWith=null;const mn=cleanMain();
  mn.innerHTML=`<div class="h">Messages</div><div class="sbar glass">${ic('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>')}<input id="se" placeholder="Chercher un ami pour discuter" onkeydown="if(event.key==='Enter')search()" oninput="search()"></div><div id="sr"></div><div id="cl"><div class="skel"></div><div class="skel"></div></div>`;
  const{data}=await sb.from("messages").select("*").or(`sender.eq.${me.id},receiver.eq.${me.id}`).order("created_at",{ascending:false}).limit(300);
  if(view!=="chat"||chatWith)return;
  const seen={},unread={};(data||[]).forEach(m=>{const o=m.sender===me.id?m.receiver:m.sender;if(!seen[o])seen[o]=m;if(m.receiver===me.id&&!m.read_at)unread[o]=(unread[o]||0)+1});
  const ids=Object.keys(seen);if(!ids.length)return $("#cl").innerHTML='<div class="empty"><b style="color:var(--fg)">Aucune discussion</b><br>Cherche un ami ci-dessus pour commencer.</div>';
  const{data:ps}=await sb.from("profiles").select("*").in("id",ids);
  $("#cl").innerHTML=ids.map(id=>{const p=ps.find(x=>x.id===id),m=seen[id],u=unread[id];
    const pv=m.audio_url?"Message vocal "+fmt(m.audio_secs):m.media_url?"Photo":esc(m.content);
    return `<div class="crow" onclick="openChat('${id}')">${av(p)}<div style="flex:1;min-width:0"><div class="row sp"><div class="nm">${esc(p.display_name)}${badges(p)}</div><div class="mu" style="${u?"color:var(--mint)":""}">${hm(m.created_at)}</div></div>
    <div class="row sp"><div class="mu pv">${m.sender===me.id?`<span class="tk ${m.read_at?"rd":""}">${ic(I.chk)}</span>`:""}${pv}</div>${u?`<span class="bdg">${u}</span>`:""}</div></div></div>`}).join("");
}
async function search(){const q=$("#se").value.trim().replace(/[%,()@]/g,"");const box=$("#sr");if(!q){box.innerHTML="";return}
  const{data}=await sb.from("profiles").select("*").or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).neq("id",me.id).limit(8);
  box.innerHTML=(data||[]).map(p=>`<div class="crow" onclick="openChat('${p.id}')">${av(p)}<div><div class="nm">${esc(p.display_name)}${badges(p)}</div><div class="mu">@${esc(p.username)} · Nouvelle discussion</div></div></div>`).join("")||'<p class="mu">Personne trouvé.</p>'}
const tick=m=>`<span class="tk ${m.read_at?"rd":""}" data-m="${m.id}">${ic(I.chk)}</span>`;
const wave=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return Array.from({length:28},(_,i)=>{h=(h*1103515245+12345)>>>0;return `<i style="height:${25+h%70}%"></i>`}).join("")};
function msgHTML(m){const mine=m.sender===me.id;
  const body=m.audio_url?`<div class="vo" data-d="${m.audio_secs||1}"><button class="vp" onclick="playVo(this)">${ic(I.play)}</button><div class="wf">${wave(m.audio_url)}</div><span class="du">${fmt(m.audio_secs)}</span><button class="vs" onclick="vSpeed(this)">1x</button><audio preload="none" src="${esc(m.audio_url)}"></audio></div>`:
   (m.media_url?`<img class="cimg" alt="" src="${esc(m.media_url)}" onclick="window.open(this.src,'_blank')">`:"")+(m.content?`<span>${esc(m.content)}</span>`:"");
  return `<div class="bub ${mine?"me":"ot"}" id="m${m.id}">${body}<span class="mt">${hm(m.created_at)}${mine?tick(m):""}</span></div>`}
function appendMsg(m){const box=$("#ms");if(!box||document.getElementById("m"+m.id))return;box.querySelector(".empty")?.remove();
  const d=new Date(m.created_at).toDateString();let sep="";if(box.dataset.day!==d){box.dataset.day=d;sep=`<div class="dsep"><span class="glass">${dayLabel(m.created_at)}</span></div>`}
  box.insertAdjacentHTML("beforeend",sep+msgHTML(m));box.scrollTop=box.scrollHeight}
function playVo(b){const w=b.closest(".vo"),a=w.querySelector("audio"),d=+w.dataset.d;document.querySelectorAll(".vo audio").forEach(x=>{if(x!==a)x.pause()});
  if(!a._i){a._i=1;const bars=w.querySelectorAll(".wf i");
    a.ontimeupdate=()=>{const p=Math.min(1,a.currentTime/d);bars.forEach((x,i)=>x.classList.toggle("on",i/bars.length<p))};
    a.onplay=()=>{w.classList.add("pl");b.innerHTML=ic(I.pause)};a.onpause=()=>{w.classList.remove("pl");b.innerHTML=ic(I.play)};
    a.onended=()=>{bars.forEach(x=>x.classList.remove("on"));a.currentTime=0}}
  a.paused?a.play().catch(()=>toast("Lecture impossible")):a.pause()}
function vSpeed(b){const a=b.closest(".vo").querySelector("audio"),n={"1x":1.5,"1.5x":2,"2x":1}[b.textContent];a.playbackRate=n;b.textContent=n+"x"}
async function openChat(id){
  view="chat";chatWith=id;setNav("chat");const mn=$("#mn");mn.className="chatmode";$("#app").classList.add("inchat");
  const[{data:p},{data:ms}]=await Promise.all([sb.from("profiles").select("*").eq("id",id).single(),sb.from("messages").select("*").or(`and(sender.eq.${me.id},receiver.eq.${id}),and(sender.eq.${id},receiver.eq.${me.id})`).order("created_at").limit(300)]);
  if(chatWith!==id)return;
  mn.innerHTML=`<div class="chat"><div class="chead glass"><button class="ib" onclick="go('chat')" aria-label="Retour">${ic(I.back)}</button>${av(p)}<div style="min-width:0"><div class="nm">${esc(p.display_name)}${badges(p)}</div><div class="mu" id="stt">@${esc(p.username)}</div></div></div>
  <div id="ms"></div><div class="comp" id="comp"></div></div>`;
  const box=$("#ms");(ms||[]).forEach(appendMsg);if(!(ms||[]).length)box.innerHTML='<div class="empty">Dis bonjour à '+esc(p.display_name)+' !</div>';
  box.scrollTop=box.scrollHeight;compIdle();sb.rpc("mark_read",{other:id});
}
function draftKey(){return 'cv-draft-'+me.id+'-'+chatWith}
function saveDraft(){try{const v=$('#mi')?.value||'';if(v)localStorage.setItem(draftKey(),v);else localStorage.removeItem(draftKey())}catch(e){}}
function toggleChatSearch(){const b=$('#chatSearch');if(!b)return;b.style.display=b.style.display==='none'?'flex':'none';if(b.style.display!=='none')$('#chatSearchInput')?.focus();else{const i=$('#chatSearchInput');if(i)i.value='';filterChatMessages()}}
function filterChatMessages(){const q=($('#chatSearchInput')?.value||'').trim().toLocaleLowerCase('fr');document.querySelectorAll('#ms .bub').forEach(b=>b.style.display=!q||b.textContent.toLocaleLowerCase('fr').includes(q)?'':'none')}
function paintChatPresence(){const s=$('#stt');if(!s||!chatWith)return;const name=s.dataset.username||'';const on=onlineUsers.has(chatWith);s.textContent=on?'En ligne':'@'+name;s.style.color=on?'var(--mint)':''}
function compIdle(){const c=$("#comp");if(!c)return;
  c.innerHTML=`<div class="in glass"><label class="ib up">${ic(I.clip)}<input type="file" accept="image/*" hidden onchange="sendImg(this)"></label><input id="mi" placeholder="Message" autocomplete="off" oninput="onType()" onkeydown="if(event.key==='Enter')sendTxt()"></div><button class="rbtn" id="mb" onclick="mainBtn()" aria-label="Envoyer ou enregistrer">${ic(I.mic)}</button>`}
function onType(){const has=$("#mi").value.trim().length>0;$("#mb").innerHTML=ic(has?I.send:I.mic);
  if(has&&Date.now()-typT>2000){typT=Date.now();chT&&chT.send({type:"broadcast",event:"t",payload:{from:me.id,to:chatWith}})}}
function showTyping(){const s=$("#stt");if(!s)return;s.textContent="écrit…";s.style.color="var(--mint)";clearTimeout(typShow);typShow=setTimeout(()=>{s.textContent="";s.style.color=""},3000)}
function mainBtn(){$("#mi").value.trim()?sendTxt():startRec()}
async function sendTxt(){const i=$("#mi"),v=i.value.trim();if(!v)return;i.value="";$("#mb").innerHTML=ic(I.mic);
  const{data,error}=await sb.from("messages").insert({sender:me.id,receiver:chatWith,content:v}).select().single();if(error)return toast("Message non envoyé");appendMsg(data)}
async function sendImg(inp){const f=inp.files[0];if(!f)return;toast("Envoi de la photo…");const path=`${me.id}/chat-${Date.now()}-${f.name.replace(/[^\w.]/g,"_")}`;
  const u=await sb.storage.from("media").upload(path,f);if(u.error)return toast(u.error.message);
  const{data,error}=await sb.from("messages").insert({sender:me.id,receiver:chatWith,content:"",media_url:sb.storage.from("media").getPublicUrl(path).data.publicUrl}).select().single();if(error)return toast("Photo non envoyée");appendMsg(data)}
async function startRec(){
  if(!navigator.mediaDevices||!window.MediaRecorder)return toast("Vocaux non pris en charge sur ce navigateur");
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const mt=["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(t=>MediaRecorder.isTypeSupported(t))||"";
    const mr=new MediaRecorder(st,mt?{mimeType:mt}:{});rec={mr,st,chunks:[],t0:Date.now(),cancel:false,mt:mr.mimeType||mt};
    mr.ondataavailable=e=>e.data.size&&rec&&rec.chunks.push(e.data);const r=rec;mr.onstop=()=>finishRec(r);mr.start();
    $("#comp").innerHTML=`<div class="in glass recing"><button class="ib" onclick="stopRec(true)" aria-label="Annuler">${ic(I.x)}</button><span class="dot"></span><b id="rt">0:00</b><span class="mu" style="flex:1">Enregistrement…</span></div><button class="rbtn" onclick="stopRec(false)" aria-label="Envoyer le vocal">${ic(I.send)}</button>`;
    rec.iv=setInterval(()=>{const t=$("#rt");t&&(t.textContent=fmt((Date.now()-rec.t0)/1000));if(Date.now()-rec.t0>300000)stopRec(false)},500);
  }catch(e){toast("Autorise le micro pour envoyer un vocal")}}
function stopRec(cancel){if(!rec)return;rec.cancel=cancel;clearInterval(rec.iv);rec.mr.state!=="inactive"&&rec.mr.stop();rec.st.getTracks().forEach(t=>t.stop())}
async function finishRec(r){if(rec===r)rec=null;compIdle();if(r.cancel)return;const secs=Math.round((Date.now()-r.t0)/1000);if(secs<1)return toast("Vocal trop court");
  const type=(r.mt||"audio/webm").split(";")[0],ext=type.includes("mp4")?"m4a":"webm",path=`${me.id}/voice-${Date.now()}.${ext}`;
  const u=await sb.storage.from("media").upload(path,new Blob(r.chunks,{type}),{contentType:type});if(u.error)return toast("Vocal non envoyé");
  const{data,error}=await sb.from("messages").insert({sender:me.id,receiver:chatWith,content:"",audio_url:sb.storage.from("media").getPublicUrl(path).data.publicUrl,audio_secs:secs}).select().single();if(error)return toast("Vocal non envoyé");appendMsg(data)}

    sb.from("posts").select("*,"+PROF+",likes(user_id),comments(count)").eq("user_id",id).neq("kind","story").order("created_at",{ascending:false}).limit(30),
    sb.from("follows").select("*",{count:"exact",head:true}).eq("following",id),sb.from("follows").select("*",{count:"exact",head:true}).eq("follower",id),
    sb.from("follows").select("*").match({follower:me.id,following:id})]);

async function follow(id,was){await(was?sb.from("follows").delete().match({follower:me.id,following:id}):sb.from("follows").insert({follower:me.id,following:id}));openProfile(id)}
function editProfile(){$("#mn").innerHTML=`<div class="h">Modifier le profil</div><div class="card glass"><input id="e1" placeholder="Nom affiché" value="${esc(me.display_name)}"><input id="e2" placeholder="Ville" value="${esc(me.city||"")}"><textarea id="e3" placeholder="Bio">${esc(me.bio||"")}</textarea><input id="e4" type="file" accept="image/*"><button class="btn full" style="margin-top:8px" onclick="saveProfile()">Enregistrer</button></div>`}
async function saveProfile(){let avatar_url=me.avatar_url;const f=$("#e4").files[0];
  if(f){const path=`${me.id}/avatar-${Date.now()}`;const u=await sb.storage.from("media").upload(path,f);if(!u.error)avatar_url=sb.storage.from("media").getPublicUrl(path).data.publicUrl}

  if(error)return toast(error.message);me=await loadMe();toast("Profil enregistré");openProfile(me.id)}

  $("#mn").innerHTML=`<div class="h">Offres Congo Vibe</div><div class="mu" style="margin:-6px 0 14px">Ton abonnement : <b style="color:var(--fg)">${till}</b></div>
  ${Object.entries(PLANS).map(([k,p])=>`<div class="plan glass ${p.hot?"pro":""}"><div class="row sp"><div class="nm" style="font:700 17px var(--disp)">${p.name}</div><div class="price">${p.price} $<span class="mu" style="font:500 12px var(--ui);-webkit-text-fill-color:var(--mute)"> / mois</span></div></div><div class="mu">${p.desc}</div></div>`).join("")}
  <div class="card glass"><div class="nm" style="margin-bottom:6px">Payer par Mobile Money</div>
  <ol class="mu" style="padding-left:18px;margin:0 0 8px"><li>Envoie le montant au <b style="color:var(--gold)">${PAY_NUMBER}</b> (Orange Money, M-Pesa ou Airtel Money)</li><li>Note l'ID de transaction reçu par SMS</li><li>Remplis le formulaire. Ton compte est activé après vérification.</li></ol>
  <select id="pl">${Object.entries(PLANS).map(([k,p])=>`<option value="${k}">${p.name} (${p.price} $)</option>`).join("")}</select>
  <select id="op"><option>Orange Money</option><option>M-Pesa</option><option>Airtel Money</option></select>
  <input id="tx" placeholder="ID de la transaction"><button class="btn full" style="margin-top:6px" onclick="pay()">J'ai payé</button></div>
  <div class="h">Mes paiements</div>${(pays||[]).map(x=>`<div class="card glass row sp"><div>${PLANS[x.plan]?.name} · ${esc(x.operator)}<div class="mu">${esc(x.tx_id)}</div></div><span class="pill ${x.status==="approved"?"ok":x.status==="rejected"?"no":""}">${{pending:"En attente",approved:"Validé",rejected:"Refusé"}[x.status]}</span></div>`).join("")||'<p class="mu">Aucun paiement.</p>'}`;
}
async function pay(){const tx=$("#tx").value.trim();if(tx.length<4)return toast("Entre l'ID de transaction");const pl=$("#pl").value;
  const{error}=await sb.from("payments").insert({user_id:me.id,plan:pl,amount:PLANS[pl].price,operator:$("#op").value,tx_id:tx});
  if(error)return toast(error.message);toast("Envoyé, en attente de validation");premiumPage()}

/* ---------- ESPACE CRÉATEUR ---------- */
async function adminPage(){
  const[{data:pays},{data:users}]=await Promise.all([sb.from("payments").select("*,profiles!user_id(username,display_name)").eq("status","pending").order("created_at"),sb.from("profiles").select("*").order("created_at",{ascending:false}).limit(50)]);
  $("#mn").innerHTML=`<div class="h">Espace créateur</div><div class="card glass"><div class="nm">Importer des vidéos TikTok</div><div class="mu" style="margin:4px 0 8px">Un lien par ligne : tes vidéos ou celles que tu as le droit d'utiliser.</div><textarea id="ttl" placeholder="https://www.tiktok.com/@manassentambwa4/video/..."></textarea><button class="btn full" id="ttb" onclick="bulkTT()">Importer dans Vidéos</button></div><div class="mu" style="margin:-6px 0 12px">Paiements à valider : ${(pays||[]).length}</div>
  ${(pays||[]).map(x=>`<div class="card glass"><div class="nm">${esc(x.profiles.display_name)} · ${PLANS[x.plan]?.name} · ${x.amount} $</div><div class="mu">${esc(x.operator)} · ID : <b style="color:var(--fg)">${esc(x.tx_id)}</b></div><div class="row" style="margin-top:10px"><button class="btn sm" onclick="appr(${x.id},true)">Valider</button><button class="btn r sm" onclick="appr(${x.id},false)">Refuser</button></div></div>`).join("")||'<div class="empty">Aucun paiement en attente.</div>'}
  <div class="h">Utilisateurs (${(users||[]).length})</div>${(users||[]).map(u=>`<div class="card glass row sp"><div class="nm">${esc(u.display_name)}${badges(u)}<div class="mu">@${esc(u.username)}</div></div>${u.role==="admin"?"":`<button class="btn g sm" onclick="verif('${u.id}',${!u.verified})">${u.verified?"Retirer ✓":"Vérifier ✓"}</button>`}</div>`).join("")}`;
}
async function bulkTT(){const ls=$("#ttl").value.split(/\s+/).filter(x=>/^https?:\/\//.test(x));if(!ls.length)return toast("Colle au moins un lien");const b=$("#ttb");b.disabled=true;let ok=0;
  for(const u of ls){b.textContent="Import "+(ok+1)+"/"+ls.length+"…";try{const e=await ttInfo(u);const{error}=await sb.from("posts").insert({user_id:me.id,content:e.title||"",media_url:u,media_type:"embed",meta:{id:e.id,author:e.author},kind:"post"});if(!error)ok++}catch(er){}}
  b.disabled=false;b.textContent="Importer dans Vidéos";toast(ok+" vidéo(s) importée(s)");$("#ttl").value=""}
async function appr(id,ok){const{error}=await sb.rpc("approve_payment",{pid:id,ok});if(error)return toast(error.message);toast(ok?"Activé":"Refusé");adminPage()}
async function verif(id,v){await sb.from("profiles").update({verified:v}).eq("id",id);adminPage()}

sb.auth.getSession().then(({data})=>data.session?boot():authScreen()).catch(()=>authScreen());
if("serviceWorker"in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});navigator.serviceWorker.addEventListener("message",e=>{if(e.data?.chat&&me)openChat(e.data.chat)})}
</script>
</body>
</html>
