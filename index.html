<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="description" content="Congo Vibe, le réseau social congolais : discute, partage, reste informé.">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<title>Congo Vibe</title>
<style>
:root{
  --bg:#070b14;--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--edge:rgba(255,255,255,.14);
  --fg:#f3f6ff;--mute:#9aa6c4;--gold:#ffc83d;--amber:#ff8a3d;--mint:#3ee0c5;--sky:#4aa3ff;--rose:#ff4d6d;
  --grad:linear-gradient(135deg,#ffd23f,#ff7a3d);--r:20px;
  --ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--disp:"Sora","Plus Jakarta Sans",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;height:100%}
body{color:var(--fg);font:15px/1.5 var(--ui);background:var(--bg);overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(60% 40% at 10% 0%,rgba(74,163,255,.32),transparent 70%),
  radial-gradient(50% 40% at 100% 20%,rgba(255,200,61,.20),transparent 70%),
  radial-gradient(60% 45% at 0% 100%,rgba(255,77,109,.20),transparent 70%),
  radial-gradient(50% 40% at 100% 100%,rgba(62,224,197,.16),transparent 70%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold);text-decoration:none}
#app{max-width:600px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.glass{background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);box-shadow:0 8px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08)}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;margin:0;background:rgba(7,11,20,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--edge);z-index:5}
.brand{display:flex;align-items:center;gap:10px}.brand svg{width:34px;height:34px;filter:drop-shadow(0 4px 10px rgba(255,138,61,.35))}
.word{font:800 20px/1 var(--disp);letter-spacing:-.4px}.word span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{font-size:12px;color:var(--mute);padding:6px 12px;border-radius:99px;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 110px;scroll-behavior:smooth}
nav{position:absolute;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;border-radius:26px;padding:6px;z-index:6;background:rgba(14,20,36,.62)}
nav button{flex:1;background:none;border:0;border-radius:18px;padding:8px 0 6px;color:var(--mute);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.2s}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold);background:rgba(255,200,61,.10)}
nav button.mid{flex:0 0 58px;height:50px;margin:0 6px;background:var(--grad);color:#1a1006;border-radius:18px;box-shadow:0 8px 22px rgba(255,122,61,.45);justify-content:center}
nav button.mid svg{width:26px;height:26px;stroke-width:2.6}
.card{border-radius:var(--r);padding:14px;margin-bottom:14px;animation:up .35s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.av{width:42px;height:42px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font:800 16px var(--disp);color:#1a1006;flex:none;overflow:hidden;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px rgba(255,200,61,.55)}
.av img{width:100%;height:100%;object-fit:cover}.av.big{width:92px;height:92px;font-size:34px;margin:0 auto}
.nm{font-weight:700}.mu{color:var(--mute);font-size:13px}
.vb{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--sky);color:#fff;font-size:9px;margin-left:5px;vertical-align:1px}
.pr{font-size:10px;font-weight:700;letter-spacing:.4px;color:#1a1006;background:var(--grad);border-radius:6px;padding:1px 6px;margin-left:5px;vertical-align:1px}
.post img.m{width:100%;border-radius:14px;margin-top:10px;max-height:440px;object-fit:cover}
.act{display:flex;gap:6px;margin-top:10px}.act button{background:var(--glass);border:1px solid var(--edge);border-radius:99px;padding:6px 12px;color:var(--mute);font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.act svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.act .on{color:var(--rose);border-color:rgba(255,77,109,.45)}.act .on svg{fill:var(--rose)}
.btn{background:var(--grad);color:#1a1006;border:0;border-radius:14px;padding:12px 18px;font-weight:700;box-shadow:0 6px 18px rgba(255,122,61,.30);transition:transform .15s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6}
.btn.g{background:var(--glass2);color:var(--fg);box-shadow:none;border:1px solid var(--edge)}.btn.r{background:linear-gradient(135deg,#ff4d6d,#d91b45);color:#fff}.btn.sm{padding:7px 14px;font-size:13px;border-radius:12px}.btn.full{width:100%}
input,textarea,select{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--edge);border-radius:14px;padding:12px 14px;margin:5px 0;outline:0;transition:.2s}
input::placeholder,textarea::placeholder{color:#76829f}
input:focus,textarea:focus,select:focus{border-color:var(--gold);background:rgba(255,255,255,.09);box-shadow:0 0 0 3px rgba(255,200,61,.15)}
select option{background:#101828}textarea{min-height:100px;resize:vertical}
input[type=file]{padding:8px}input[type=file]::file-selector-button{background:var(--grad);color:#1a1006;border:0;border-radius:10px;padding:8px 12px;font-weight:700;margin-right:10px}
input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{background:var(--glass);border:1px solid var(--edge);border-radius:99px;padding:7px 15px;white-space:nowrap;color:var(--mute);font-weight:600;font-size:13px}
.tabs .on{background:var(--grad);color:#1a1006;border-color:transparent}
.h{font:700 17px var(--disp);margin:6px 0 12px;letter-spacing:-.2px}
.stories,.strip{display:flex;gap:12px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}.stories::-webkit-scrollbar,.strip::-webkit-scrollbar{display:none}
.st{text-align:center;font-size:11px;width:64px;flex:none;color:var(--mute)}
.st .av{width:60px;height:60px;margin:auto;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--rose)}
.nc{position:relative;border-radius:18px;overflow:hidden;background:var(--glass2);border:1px solid var(--edge);display:block;text-decoration:none;color:var(--fg);animation:up .35s both}
.nc .im{position:absolute;inset:0;background:linear-gradient(135deg,#1b2a52,#3a1f3d)}.nc .im img{width:100%;height:100%;object-fit:cover}
.nc .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,20,.05) 20%,rgba(7,11,20,.92))}
.nc .tx{position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:100%;padding:14px}
.nc .src{align-self:flex-start;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);margin-bottom:8px}
.nc .tt{font:700 15px/1.3 var(--disp);text-wrap:balance}.nc .tm{color:#c5cee6;font-size:12px;margin-top:6px}
.strip .nc{flex:none;width:250px;height:170px}.list .nc.hero{height:250px;margin-bottom:12px}.list .nc.hero .tt{font-size:19px}
.nl{display:flex;gap:12px;border-radius:16px;padding:10px;margin-bottom:10px;text-decoration:none;color:var(--fg);animation:up .35s both}
.nl .th{width:92px;height:92px;border-radius:12px;flex:none;background:linear-gradient(135deg,#1b2a52,#3a1f3d);overflow:hidden}.nl .th img{width:100%;height:100%;object-fit:cover}
.nl .tt{font:600 14px/1.35 var(--disp);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.nl .in{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.nl .src{color:var(--gold);font-weight:700;font-size:12px}
.bub{max-width:80%;padding:9px 14px;border-radius:18px;margin:5px 0;word-break:break-word;animation:up .2s both}
.me{background:var(--grad);color:#1a1006;margin-left:auto;border-bottom-right-radius:6px;font-weight:500}.ot{background:var(--glass2);border:1px solid var(--edge);border-bottom-left-radius:6px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--glass2)}.pill.ok{background:rgba(62,224,197,.2);color:var(--mint)}.pill.no{background:rgba(255,77,109,.2);color:var(--rose)}
.plan{border-radius:20px;padding:16px;margin-bottom:12px}.plan.pro{border-color:rgba(255,200,61,.6);box-shadow:0 0 0 1px rgba(255,200,61,.25),0 10px 34px rgba(255,138,61,.18)}
.price{font:800 22px var(--disp);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover{height:90px;margin:-14px -14px -44px;border-radius:20px 20px 0 0;background:linear-gradient(120deg,rgba(74,163,255,.55),rgba(255,200,61,.45),rgba(255,77,109,.5))}
.auth{height:100%;overflow-y:auto;padding:calc(36px + env(safe-area-inset-top,0px)) 20px 30px;display:flex;flex-direction:column;justify-content:center}
.auth .logo{width:84px;height:84px;margin:0 auto 14px;filter:drop-shadow(0 12px 28px rgba(255,138,61,.4))}.auth h1{font:800 38px/1.05 var(--disp);text-align:center;margin:0 0 8px;letter-spacing:-1px}
.auth .sub{text-align:center;color:var(--mute);margin:0 0 22px}.auth .glass{border-radius:24px;padding:18px}
.feats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}.feats span{font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--edge);color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
.err{border-radius:16px;padding:14px;margin:10px 0;background:rgba(255,77,109,.12);border:1px solid rgba(255,77,109,.4)}
.skel{height:110px;border-radius:18px;background:linear-gradient(90deg,var(--glass),rgba(255,255,255,.13),var(--glass));background-size:200% 100%;animation:sk 1.3s infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:30;padding:11px 18px;border-radius:16px;max-width:88%;font-weight:600;font-size:14px;background:rgba(20,28,48,.85);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--edge);animation:up .25s both}
.sticky{position:sticky;bottom:0;padding:8px 0 2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL="https://gyzodhzueahfxaaerbux.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5em9kaHp1ZWFoZnhhYWVyYnV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4NDg1NzcsImV4cCI6MjExMDQyNDU3N30.GTL83H4oik7cT6M_FEjOUj-_e-e5QzzSB4gpg6xMfsI";
const PAY_NUMBER="0846464895";
const PLANS={premium:{name:"Premium",price:2,desc:"Stories 48 h, boost des publications, badge Premium"},pro:{name:"Pro Média",price:5,desc:"Tout Premium, badge vérifié et publication dans le fil Actualités",hot:1}};
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u)?esc(u):"#";
let me=null,view="home",tab="all",chatWith=null,newsSrc="Tous",NEWS=null;
const isPrem=p=>p&&(p.role==="admin"||(p.premium_until&&new Date(p.premium_until)>new Date()));
const ago=d=>{const s=(Date.now()-new Date(d))/1e3;return s<60?"à l'instant":s<3600?"il y a "+Math.floor(s/60)+" min":s<86400?"il y a "+Math.floor(s/3600)+" h":"il y a "+Math.floor(s/86400)+" j"};
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
const LOGO=`<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient><linearGradient id="lb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c3a78"/><stop offset="1" stop-color="#0b1426"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lb)"/><path d="M15 21a10 10 0 0 1 10-10h14a10 10 0 0 1 10 10v11a10 10 0 0 1-10 10H31l-10 9v-9.6A10 10 0 0 1 15 32z" fill="url(#lg)"/><polygon points="32,17 34.4,24.2 42,24.3 35.9,28.8 38.2,36 32,31.6 25.8,36 28.1,28.8 22,24.3 29.6,24.2" fill="#0b1426"/></svg>`;
const NI={home:`<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>`,news:`<path d="M4 4h13v16H6a2 2 0 0 1-2-2z"/><path d="M17 8h3v10a2 2 0 0 1-2 2M8 8h5M8 12h5M8 16h3"/>`,new:`<path d="M12 5v14M5 12h14"/>`,chat:`<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>`,me:`<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>`};
const av=(p,c="")=>`<div class="av ${c}" onclick="openProfile('${p.id}')">${p.avatar_url?`<img alt="" src="${esc(p.avatar_url)}">`:esc((p.display_name||p.username||"?")[0].toUpperCase())}</div>`;
const badges=p=>(p.verified||p.role==="admin"?'<span class="vb">✓</span>':"")+(p.role==="admin"?'<span class="pr">CRÉATEUR</span>':isPrem(p)?'<span class="pr">PREMIUM</span>':"");

/* ---------- AUTH ---------- */
function authScreen(mode="in"){
  app.innerHTML=`<div class="auth"><div class="logo">${LOGO}</div><h1>Congo <span style="background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent">Vibe</span></h1>
  <p class="sub">Discute, partage et reste informé.<br>Le réseau social fait chez nous.</p>
  <div class="feats"><span>Messages</span><span>Stories</span><span>Actus RDC</span><span>Premium</span></div>
  <div class="glass">${mode==="up"?'<input id="dn" placeholder="Ton nom (ex: Manasse)" autocomplete="name">':""}
  <input id="em" type="email" placeholder="Adresse e-mail" autocomplete="email"><input id="pw" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="${mode==="in"?"current-password":"new-password"}">
  <button class="btn full" style="margin-top:10px" id="ab" onclick="doAuth('${mode}')">${mode==="in"?"Se connecter":"Créer mon compte"}</button></div>
  <p class="mu" style="text-align:center;margin-top:16px"><a href="#" onclick="authScreen('${mode==="in"?"up":"in"}');return false">${mode==="in"?"Pas encore de compte ? Inscris-toi":"Déjà un compte ? Connecte-toi"}</a></p></div>`;
}
async function doAuth(mode){
  const email=$("#em").value.trim(),password=$("#pw").value;if(!email||!password)return toast("Remplis e-mail et mot de passe");
  $("#ab").disabled=true;
  const r=mode==="in"?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password,options:{data:{display_name:$("#dn").value.trim()}}});
  if(r.error){$("#ab").disabled=false;return toast(({"Invalid login credentials":"E-mail ou mot de passe incorrect","User already registered":"Cet e-mail a déjà un compte"})[r.error.message]||r.error.message)}
  if(mode==="up"&&!r.data.session){const l=await sb.auth.signInWithPassword({email,password});if(l.error){$("#ab").disabled=false;return toast(l.error.message)}}
  boot();
}
async function loadMe(){const{data:{user}}=await sb.auth.getUser();if(!user)return null;const{data}=await sb.from("profiles").select("*").eq("id",user.id).single();return data}
async function boot(){
  me=await loadMe();if(!me)return authScreen();
  app.innerHTML=`<header><div class="brand">${LOGO}<div class="word">Congo <span>Vibe</span></div></div><div class="chip glass" id="who"></div></header><main id="mn"></main>
  <nav class="glass">${[["home","Accueil"],["news","Actus RDC"],["new","Créer"],["chat","Messages"],["me","Profil"]].map(([k,l])=>`<button data-v="${k}" class="${k==="new"?"mid":""}" aria-label="${l}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${NI[k]}</svg>${k==="new"?"":l}</button>`).join("")}</nav>`;
  $("#who").textContent="@"+me.username;
  sb.channel("msgs").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>{
    if(p.new.receiver!==me.id&&p.new.sender!==me.id)return;
    if(view==="chat")chatWith&&(p.new.sender===chatWith||p.new.receiver===chatWith)?openChat(chatWith):renderChats();
    else if(p.new.receiver===me.id)toast("Nouveau message")}).subscribe();
  go("home");
}
function setNav(v){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v&&v!=="new"))}
function go(v){view=v;chatWith=null;setNav(v);({home:()=>renderFeed("all"),news:()=>renderFeed("news"),new:renderNew,chat:renderChats,me:()=>openProfile(me.id)})[v]();$("#mn").scrollTop=0}

/* ---------- ACTUALITÉS ---------- */
async function loadNews(force){
  if(NEWS&&!force&&!NEWS.error)return NEWS;
  try{const r=await fetch(SB_URL+"/functions/v1/news",{headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}});if(!r.ok)throw 0;NEWS=await r.json()}catch(e){NEWS={items:[],sources:[],error:true}}
  return NEWS;
}
const nImg=n=>n.image?`<img alt="" loading="lazy" referrerpolicy="no-referrer" src="${esc(n.image)}" onerror="this.remove()">`:"";
const nTime=n=>n.date?ago(n.date):"";
const newsCard=(n,cls="")=>`<a class="nc ${cls}" href="${safeUrl(n.link)}" target="_blank" rel="noopener noreferrer"><div class="im">${nImg(n)}</div><div class="sh"></div><div class="tx"><span class="src">${esc(n.source)}</span><div class="tt">${esc(n.title)}</div><div class="tm">${nTime(n)}</div></div></a>`;
const newsRow=n=>`<a class="nl glass" href="${safeUrl(n.link)}" target="_blank" rel="noopener noreferrer"><div class="th">${nImg(n)}</div><div class="in"><div class="tt">${esc(n.title)}</div><div class="mu"><span class="src">${esc(n.source)}</span> · ${nTime(n)}</div></div></a>`;
function paintNews(){
  const box=$("#nw");if(!box)return;const d=NEWS;
  if(!d||d.error||!d.items.length){box.innerHTML=`<div class="err">Les actualités ne se chargent pas pour le moment.<br><button class="btn sm" style="margin-top:8px" onclick="loadNews(true).then(paintNews)">Réessayer</button></div>`;return}
  const items=newsSrc==="Tous"?d.items:d.items.filter(i=>i.source===newsSrc);
  box.innerHTML=`<div class="tabs">${["Tous",...d.sources].map(s=>`<button class="${s===newsSrc?"on":""}" onclick="newsSrc=this.textContent;paintNews()">${esc(s)}</button>`).join("")}</div><div class="list">${items[0]?newsCard(items[0],"hero"):""}${items.slice(1,40).map(newsRow).join("")}</div>`;
}

/* ---------- FIL ---------- */
const PROF="profiles!user_id(id,username,display_name,avatar_url,verified,role,premium_until)";
async function renderFeed(kind){
  const mn=$("#mn");mn.innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  let q=sb.from("posts").select("*,"+PROF+",likes(user_id),comments(count)").order("boosted",{ascending:false}).order("created_at",{ascending:false}).limit(60);
  if(kind==="news")q=q.eq("kind","news");
  else if(tab==="following"){const{data:f}=await sb.from("follows").select("following").eq("follower",me.id);q=q.in("user_id",(f||[]).map(x=>x.following).concat(me.id)).neq("kind","story")}
  else q=q.neq("kind","story");
  const[{data:posts,error},st]=await Promise.all([q,kind==="all"?sb.from("posts").select("id,content,media_url,"+PROF).eq("kind","story").order("created_at",{ascending:false}):{data:[]}]);
  if(view!==(kind==="news"?"news":"home"))return;
  if(error)return mn.innerHTML=`<div class="err">Impossible de charger le fil. Vérifie ta connexion.<br><button class="btn sm" style="margin-top:8px" onclick="renderFeed('${kind}')">Réessayer</button></div>`;
  window._stories=st.data||[];
  const empty=`<div class="empty"><b style="color:var(--fg)">${kind==="news"?"Pas encore de publication de médias":"Rien ici pour le moment"}</b><br>${kind==="news"?"Les médias vérifiés publieront ici.":"Sois le premier à publier !"}</div>`;
  if(kind==="news"){
    mn.innerHTML=`<div class="h">À la une en RDC</div><div id="nw"><div class="skel" style="height:250px"></div></div><div class="h" style="margin-top:20px">Médias vérifiés sur Congo Vibe</div>${(posts||[]).map(postHTML).join("")||empty}`;
    loadNews().then(paintNews);return;
  }
  mn.innerHTML=`<div class="tabs"><button class="${tab==="all"?"on":""}" onclick="tab='all';renderFeed('all')">Pour toi</button><button class="${tab==="following"?"on":""}" onclick="tab='following';renderFeed('all')">Abonnements</button></div>
  <div id="strip"></div>${window._stories.length?`<div class="stories">${window._stories.map(s=>`<div class="st" onclick="viewStory(${s.id})">${av(s.profiles)}<div style="margin-top:6px">${esc(s.profiles.username)}</div></div>`).join("")}</div>`:""}
  ${(posts||[]).map(postHTML).join("")||empty}`;
  loadNews().then(d=>{const el=$("#strip");if(el&&d.items.length)el.innerHTML=`<div class="h" style="display:flex;justify-content:space-between">À la une en RDC<a href="#" style="font:600 13px var(--ui)" onclick="go('news');return false">Tout voir</a></div><div class="strip">${d.items.slice(0,8).map(n=>newsCard(n)).join("")}</div>`});
}
function postHTML(p){
  const liked=p.likes.some(l=>l.user_id===me.id),n=p.comments[0]?.count||0;
  return `<div class="card glass post" id="p${p.id}"><div class="row">${av(p.profiles)}<div style="flex:1;min-width:0"><div class="nm">${esc(p.profiles.display_name)}${badges(p.profiles)}</div><div class="mu">@${esc(p.profiles.username)} · ${ago(p.created_at)}${p.kind==="news"?" · Actu":""}${p.boosted?" · Sponsorisé":""}</div></div>
  ${p.user_id===me.id||me.role==="admin"?`<button class="btn g sm" onclick="delPost(${p.id})">Supprimer</button>`:""}</div>
  <div style="margin-top:10px;white-space:pre-wrap">${esc(p.content)}</div>${p.media_url?`<img class="m" alt="" loading="lazy" src="${esc(p.media_url)}">`:""}
  <div class="act"><button class="${liked?"on":""}" onclick="like(${p.id},${liked})"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z"/></svg>${p.likes.length}</button><button onclick="comments(${p.id})"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>${n}</button><button onclick="share()">Partager</button></div><div id="c${p.id}"></div></div>`;
}
async function like(id,was){await(was?sb.from("likes").delete().match({post_id:id,user_id:me.id}):sb.from("likes").insert({post_id:id,user_id:me.id}));const y=$("main").scrollTop;await(view==="news"?renderFeed("news"):view==="home"?renderFeed("all"):openProfile(location._pf||me.id));$("main").scrollTop=y}
async function delPost(id){await sb.from("posts").delete().eq("id",id);document.getElementById("p"+id)?.remove()}
function share(){const u=location.href.split("#")[0];(navigator.share?navigator.share({title:"Congo Vibe",text:"Rejoins-moi sur Congo Vibe",url:u}):navigator.clipboard.writeText(u).then(()=>toast("Lien copié"))).catch(()=>{})}
async function comments(id){
  const box=$("#c"+id);if(box.innerHTML){box.innerHTML="";return}
  const{data}=await sb.from("comments").select("*,profiles!user_id(username,display_name)").eq("post_id",id).order("created_at");
  box.innerHTML=`<div style="margin-top:10px">${(data||[]).map(c=>`<div class="mu" style="margin:6px 0"><b style="color:var(--fg)">${esc(c.profiles.display_name)}</b> ${esc(c.content)}</div>`).join("")}</div><div class="row"><input id="ci${id}" placeholder="Ajouter un commentaire" onkeydown="if(event.key==='Enter')addComment(${id})"><button class="btn sm" onclick="addComment(${id})">Envoyer</button></div>`;
}
async function addComment(id){const v=$("#ci"+id).value.trim();if(!v)return;const{error}=await sb.from("comments").insert({post_id:id,user_id:me.id,content:v});if(error)return toast(error.message);$("#c"+id).innerHTML="";comments(id)}
function viewStory(id){const s=(window._stories||[]).find(x=>x.id===id);if(!s)return;
  const o=document.createElement("div");o.style="position:fixed;inset:0;background:rgba(5,8,16,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:40;display:grid;place-items:center;padding:20px;text-align:center";
  o.onclick=()=>o.remove();o.innerHTML=`<div><div class="nm" style="margin-bottom:12px">@${esc(s.profiles.username)}</div>${s.media_url?`<img alt="" src="${esc(s.media_url)}" style="max-width:100%;max-height:68vh;border-radius:20px">`:""}<p style="font:700 20px var(--disp)">${esc(s.content)}</p><p class="mu">Touche pour fermer</p></div>`;document.body.appendChild(o)}

/* ---------- CRÉER ---------- */
function renderNew(){
  const canNews=me.verified||me.role==="admin",prem=isPrem(me);
  $("#mn").innerHTML=`<div class="h">Nouvelle publication</div><div class="card glass"><textarea id="tx" maxlength="2000" placeholder="Quoi de neuf à Kinshasa ?"></textarea>
  <input id="fl" type="file" accept="image/*">
  <select id="kd"><option value="post">Publication</option>${canNews?'<option value="news">Actualité (fil congolais)</option>':""}<option value="story">Story 48 h${prem?"":" (Premium)"}</option></select>
  <label class="row mu" style="margin:8px 0"><input id="bo" type="checkbox"> Booster en haut du fil${prem?"":" (Premium)"}</label>
  <button class="btn full" id="pb" onclick="publish()">Publier</button></div>
  ${prem?"":'<div class="card glass mu">Passe en Premium pour les stories, le boost et le badge. <a href="#" onclick="premiumPage();return false">Voir les offres</a></div>'}`;
}
async function publish(){
  const content=$("#tx").value.trim();if(!content)return toast("Écris quelque chose");
  $("#pb").disabled=true;let media_url=null;const f=$("#fl").files[0];
  if(f){const path=`${me.id}/${Date.now()}-${f.name.replace(/[^\w.]/g,"_")}`;const u=await sb.storage.from("media").upload(path,f);if(u.error){$("#pb").disabled=false;return toast(u.error.message)}media_url=sb.storage.from("media").getPublicUrl(path).data.publicUrl}
  const{error}=await sb.from("posts").insert({user_id:me.id,content,media_url,kind:$("#kd").value,boosted:$("#bo").checked});
  $("#pb").disabled=false;if(error)return toast(error.message.includes("Premium")?"Fonction réservée aux membres Premium":error.message);
  toast("Publié !");go($("#kd").value==="news"?"news":"home");
}

/* ---------- MESSAGES ---------- */
async function renderChats(){
  chatWith=null;const mn=$("#mn");
  mn.innerHTML=`<div class="h">Messages</div><div class="row"><input id="se" placeholder="Chercher quelqu'un" onkeydown="if(event.key==='Enter')search()"><button class="btn sm" onclick="search()">Chercher</button></div><div id="sr"></div><div id="cl"><div class="skel"></div></div>`;
  const{data}=await sb.from("messages").select("*").or(`sender.eq.${me.id},receiver.eq.${me.id}`).order("created_at",{ascending:false}).limit(200);
  const seen={};(data||[]).forEach(m=>{const o=m.sender===me.id?m.receiver:m.sender;if(!seen[o])seen[o]=m});
  const ids=Object.keys(seen);if(!ids.length)return $("#cl").innerHTML='<div class="empty">Aucune discussion.<br>Cherche un ami ci-dessus pour commencer.</div>';
  const{data:ps}=await sb.from("profiles").select("*").in("id",ids);
  $("#cl").innerHTML=ids.map(id=>{const p=ps.find(x=>x.id===id),m=seen[id];return `<div class="card glass row" onclick="openChat('${id}')">${av(p)}<div style="flex:1;min-width:0"><div class="nm">${esc(p.display_name)}${badges(p)}</div><div class="mu" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.sender===me.id?"Toi : ":""}${esc(m.content)}</div></div><div class="mu">${ago(m.created_at)}</div></div>`}).join("");
}
async function search(){const q=$("#se").value.trim().replace(/[%,()@]/g,"");if(!q)return;
  const{data}=await sb.from("profiles").select("*").or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).neq("id",me.id).limit(10);
  $("#sr").innerHTML=(data||[]).map(p=>`<div class="card glass row" style="margin-top:10px" onclick="openChat('${p.id}')">${av(p)}<div><div class="nm">${esc(p.display_name)}${badges(p)}</div><div class="mu">@${esc(p.username)}</div></div></div>`).join("")||'<p class="mu">Personne trouvé.</p>'}
async function openChat(id){
  view="chat";chatWith=id;setNav("chat");
  const[{data:p},{data:ms}]=await Promise.all([sb.from("profiles").select("*").eq("id",id).single(),sb.from("messages").select("*").or(`and(sender.eq.${me.id},receiver.eq.${id}),and(sender.eq.${id},receiver.eq.${me.id})`).order("created_at").limit(300)]);
  $("#mn").innerHTML=`<div class="row" style="margin-bottom:12px"><button class="btn g sm" onclick="go('chat')">Retour</button>${av(p)}<div class="nm">${esc(p.display_name)}${badges(p)}</div></div>
  <div id="ms">${(ms||[]).map(m=>`<div class="bub ${m.sender===me.id?"me":"ot"}">${esc(m.content)}</div>`).join("")||'<div class="empty">Dis bonjour !</div>'}</div>
  <div class="row sticky"><input id="mi" placeholder="Écris un message…" onkeydown="if(event.key==='Enter')send('${id}')"><button class="btn" onclick="send('${id}')">Envoyer</button></div>`;
  $("#mn").scrollTop=$("#mn").scrollHeight;
}
async function send(id){const v=$("#mi").value.trim();if(!v)return;$("#mi").value="";const{error}=await sb.from("messages").insert({sender:me.id,receiver:id,content:v});if(error)toast(error.message)}

/* ---------- PROFIL ---------- */
async function openProfile(id){
  view=id===me.id?"me":"prof";location._pf=id;setNav(view);
  const mn=$("#mn");const[{data:p},{data:ps},{count:fr},{count:fg},{data:isF}]=await Promise.all([
    sb.from("profiles").select("*").eq("id",id).single(),
    sb.from("posts").select("*,"+PROF+",likes(user_id),comments(count)").eq("user_id",id).neq("kind","story").order("created_at",{ascending:false}).limit(30),
    sb.from("follows").select("*",{count:"exact",head:true}).eq("following",id),sb.from("follows").select("*",{count:"exact",head:true}).eq("follower",id),
    sb.from("follows").select("*").match({follower:me.id,following:id})]);
  if(!p)return mn.innerHTML='<div class="err">Profil introuvable.</div>';
  const mine=id===me.id;
  mn.innerHTML=`<div class="card glass" style="text-align:center"><div class="cover"></div>${av(p,"big")}<div class="nm" style="font:800 21px var(--disp);margin-top:10px">${esc(p.display_name)}${badges(p)}</div><div class="mu">@${esc(p.username)}${p.city?" · "+esc(p.city):""}</div><p>${esc(p.bio||"")}</p>
  <div class="row" style="justify-content:center;gap:22px"><span><b>${fr||0}</b> <span class="mu">abonnés</span></span><span><b>${fg||0}</b> <span class="mu">abonnements</span></span></div><div class="row wrap" style="justify-content:center;margin-top:14px">
  ${mine?`<button class="btn sm" onclick="editProfile()">Modifier</button><button class="btn sm" onclick="premiumPage()">Premium</button>${me.role==="admin"?'<button class="btn r sm" onclick="adminPage()">Espace créateur</button>':""}<button class="btn g sm" onclick="sb.auth.signOut().then(()=>{me=null;authScreen()})">Déconnexion</button>`
  :`<button class="btn sm ${isF?.length?"g":""}" onclick="follow('${id}',${!!isF?.length})">${isF?.length?"Abonné":"S'abonner"}</button><button class="btn g sm" onclick="openChat('${id}')">Message</button>`}</div></div>`+((ps||[]).map(postHTML).join("")||'<div class="empty">Aucune publication.</div>');
}
async function follow(id,was){await(was?sb.from("follows").delete().match({follower:me.id,following:id}):sb.from("follows").insert({follower:me.id,following:id}));openProfile(id)}
function editProfile(){$("#mn").innerHTML=`<div class="h">Modifier le profil</div><div class="card glass"><input id="e1" placeholder="Nom affiché" value="${esc(me.display_name)}"><input id="e2" placeholder="Ville" value="${esc(me.city||"")}"><textarea id="e3" placeholder="Bio">${esc(me.bio||"")}</textarea><input id="e4" type="file" accept="image/*"><button class="btn full" style="margin-top:8px" onclick="saveProfile()">Enregistrer</button></div>`}
async function saveProfile(){let avatar_url=me.avatar_url;const f=$("#e4").files[0];
  if(f){const path=`${me.id}/avatar-${Date.now()}`;const u=await sb.storage.from("media").upload(path,f);if(!u.error)avatar_url=sb.storage.from("media").getPublicUrl(path).data.publicUrl}
  const{error}=await sb.from("profiles").update({display_name:$("#e1").value.trim()||me.display_name,city:$("#e2").value.trim(),bio:$("#e3").value.trim(),avatar_url}).eq("id",me.id);
  if(error)return toast(error.message);me=await loadMe();toast("Profil enregistré");openProfile(me.id)}

/* ---------- PREMIUM / MOBILE MONEY ---------- */
async function premiumPage(){
  view="me";setNav("me");
  const{data:pays}=await sb.from("payments").select("*").eq("user_id",me.id).order("created_at",{ascending:false}).limit(10);
  const till=me.role==="admin"?"Illimité (créateur)":isPrem(me)?"jusqu'au "+new Date(me.premium_until).toLocaleDateString("fr-FR"):"Non actif";
  $("#mn").innerHTML=`<div class="h">Offres Congo Vibe</div><div class="mu" style="margin:-6px 0 14px">Ton abonnement : <b style="color:var(--fg)">${till}</b></div>
  ${Object.entries(PLANS).map(([k,p])=>`<div class="plan glass ${p.hot?"pro":""}"><div class="row sp"><div class="nm" style="font:700 17px var(--disp)">${p.name}</div><div class="price">${p.price} $<span class="mu" style="font:500 12px var(--ui);-webkit-text-fill-color:var(--mute)"> / mois</span></div></div><div class="mu">${p.desc}</div></div>`).join("")}
  <div class="card glass"><div class="nm" style="margin-bottom:6px">Payer par Mobile Money</div>
  <ol class="mu" style="padding-left:18px;margin:0 0 8px"><li>Envoie le montant au <b style="color:var(--gold)">${PAY_NUMBER}</b> (Orange Money, M-Pesa ou Airtel Money)</li><li>Note l'ID de transaction reçu par SMS</li><li>Remplis le formulaire. Ton compte est activé après vérification.</li></ol>
  <select id="pl">${Object.entries(PLANS).map(([k,p])=>`<option value="${k}">${p.name} (${p.price} $)</option>`).join("")}</select>
  <select id="op"><option>Orange Money</option><option>M-Pesa</option><option>Airtel Money</option></select>
  <input id="tx" placeholder="ID de la transaction"><button class="btn full" style="margin-top:6px" onclick="pay()">J'ai payé</button></div>
  <div class="h">Mes paiements</div>${(pays||[]).map(x=>`<div class="card glass row sp"><div>${PLANS[x.plan]?.name} · ${esc(x.operator)}<div class="mu">${esc(x.tx_id)}</div></div><span class="pill ${x.status==="approved"?"ok":x.status==="rejected"?"no":""}">${{pending:"En attente",approved:"Validé",rejected:"Refusé"}[x.status]}</span></div>`).join("")||'<p class="mu">Aucun paiement.</p>'}`;
}
async function pay(){const tx=$("#tx").value.trim();if(tx.length<4)return toast("Entre l'ID de transaction");const pl=$("#pl").value;
  const{error}=await sb.from("payments").insert({user_id:me.id,plan:pl,amount:PLANS[pl].price,operator:$("#op").value,tx_id:tx});
  if(error)return toast(error.message);toast("Envoyé, en attente de validation");premiumPage()}

/* ---------- ESPACE CRÉATEUR ---------- */
async function adminPage(){
  const[{data:pays},{data:users}]=await Promise.all([sb.from("payments").select("*,profiles!user_id(username,display_name)").eq("status","pending").order("created_at"),sb.from("profiles").select("*").order("created_at",{ascending:false}).limit(50)]);
  $("#mn").innerHTML=`<div class="h">Espace créateur</div><div class="mu" style="margin:-6px 0 12px">Paiements à valider : ${(pays||[]).length}</div>
  ${(pays||[]).map(x=>`<div class="card glass"><div class="nm">${esc(x.profiles.display_name)} · ${PLANS[x.plan]?.name} · ${x.amount} $</div><div class="mu">${esc(x.operator)} · ID : <b style="color:var(--fg)">${esc(x.tx_id)}</b></div><div class="row" style="margin-top:10px"><button class="btn sm" onclick="appr(${x.id},true)">Valider</button><button class="btn r sm" onclick="appr(${x.id},false)">Refuser</button></div></div>`).join("")||'<div class="empty">Aucun paiement en attente.</div>'}
  <div class="h">Utilisateurs (${(users||[]).length})</div>${(users||[]).map(u=>`<div class="card glass row sp"><div class="nm">${esc(u.display_name)}${badges(u)}<div class="mu">@${esc(u.username)}</div></div>${u.role==="admin"?"":`<button class="btn g sm" onclick="verif('${u.id}',${!u.verified})">${u.verified?"Retirer ✓":"Vérifier ✓"}</button>`}</div>`).join("")}`;
}
async function appr(id,ok){const{error}=await sb.rpc("approve_payment",{pid:id,ok});if(error)return toast(error.message);toast(ok?"Activé":"Refusé");adminPage()}
async function verif(id,v){await sb.from("profiles").update({verified:v}).eq("id",id);adminPage()}

sb.auth.getSession().then(({data})=>data.session?boot():authScreen()).catch(()=>authScreen());
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
